<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>系统升级中</title>
    <style>
      *,
      *::after,
      *::before {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f2f5f9;
        color: #1f2a37;
        padding: 24px;
      }

      .card {
        text-align: center;
        max-width: 320px;
        width: 100%;
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        background: rgba(102, 126, 234, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s ease-in-out infinite;
      }

      .icon svg {
        width: 36px;
        height: 36px;
        opacity: 0.9;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 10px;
      }

      p {
        font-size: 15px;
        opacity: 0.75;
        line-height: 1.6;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </div>
      <h1>系统升级中</h1>
      <p>请稍后重试</p>
    </div>
  </body>
</html>
